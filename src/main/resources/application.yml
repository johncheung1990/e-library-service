server:
  port: 8080
  servlet:
    context-path: /elibrary

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/elibrary?useUnicode=true&characterEncoding=UTF-8&useSSL=false
    username: root
    password: ken@1234
    driver-class-name: com.mysql.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 1
      connection-timeout: 30000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zzj.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.library: DEBUG